# Netlify hosts the pages in app/; the API (serve.py + MongoDB) runs on the laptop, reached through ngrok.
[build]
  publish = "app"

# API calls are forwarded to the laptop, so the browser sees one site (no CORS).
# The header skips ngrok's free-plan warning page, which would otherwise replace the JSON.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-NGROK-DOMAIN.ngrok-free.app/api/:splat"
  status = 200
  force = true
  headers = {ngrok-skip-browser-warning = "true"}

# sign-in pages
[[redirects]]
  from = "/faculty"
  to = "/Portal.dc.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/Portal.dc.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/Portal.dc.html"
  status = 200
